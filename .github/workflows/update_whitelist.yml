name: Update ip

on:
  schedule:
    # 每 8 小时执行 (UTC 00/08/16，北京时间 08:00/16:00/00:00)
    - cron: '0 */8 * * *'
  workflow_dispatch:
    # 允许手动触发

permissions:
  contents: write

concurrency:
  group: update-whitelist
  cancel-in-progress: false

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Node Resolver
        env:
          AIRPORT1: ${{ secrets.AIRPORT1 }}
          AIRPORT2: ${{ secrets.AIRPORT2 }}
          AIRPORT3: ${{ secrets.AIRPORT3 }}
        run: |
          python scripts/resolve_nodes.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_routes.yaml
          if ! git diff --staged --quiet; then
            git commit -m "Scheduled Updates"
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          else
            echo "No changes to commit."
          fi
